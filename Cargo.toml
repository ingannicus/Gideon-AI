[package]
name = "gideon-ai"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
reqwest = { version = "0.12", features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
webbrowser = "1.0"
chrono = "0.4"
sysinfo = "0.32"

[build-dependencies]

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"
