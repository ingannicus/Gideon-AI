[package]
name = "gideon-ai"
version = "5.0.1"
edition = "2021"
rust-version = "1.75"
authors = ["Rocco Degiacomo"]
description = "Assistente AI locale con hardware detection, GGUF picker e integrazione MCP (WordCraft/GridCraft/PdfCraft)"
license = "MIT"
readme = "README.md"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = [
    "rt-multi-thread", "macros", "net", "process", "io-util", "time", "signal"
] }
tokio-stream = "0.1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls", "stream", "json"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
futures-util = "0.3"
sysinfo = "0.32"
rmcp = { version = "0.3.2", features = ["client", "transport-child-process"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
webbrowser = "1.0"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2