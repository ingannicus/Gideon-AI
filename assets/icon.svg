<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d131a"/>
      <stop offset="100%" stop-color="#07090b"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sfondo arrotondato -->
  <rect width="256" height="256" rx="48" ry="48" fill="url(#bg)"/>

  <!-- Anello esterno decorativo -->
  <circle cx="128" cy="128" r="100" fill="none" stroke="#00ff66" stroke-width="1.5" stroke-dasharray="12 6" opacity="0.3"/>

  <!-- Anello medio -->
  <circle cx="128" cy="128" r="82" fill="none" stroke="#00cc52" stroke-width="1" opacity="0.2"/>

  <!-- Lettera G principale con filtro glow -->
  <text x="128" y="155"
        font-family="Consolas, 'Courier New', monospace"
        font-size="110"
        font-weight="bold"
        text-anchor="middle"
        fill="#00ff66"
        filter="url(#glow)"
        letter-spacing="-4">G</text>

  <!-- Sottolineatura / barra terminale -->
  <rect x="72" y="172" width="112" height="3" rx="2" fill="#00ff66" opacity="0.6"/>

  <!-- Prompt terminale piccolo in basso -->
  <text x="128" y="210"
        font-family="Consolas, 'Courier New', monospace"
        font-size="18"
        text-anchor="middle"
        fill="#00cc52"
        opacity="0.7"
        letter-spacing="2">AI</text>

  <!-- Angoli decorativi stile HUD -->
  <path d="M 30 30 L 30 52 M 30 30 L 52 30" stroke="#00ff66" stroke-width="2.5" fill="none" opacity="0.5"/>
  <path d="M 226 30 L 226 52 M 226 30 L 204 30" stroke="#00ff66" stroke-width="2.5" fill="none" opacity="0.5"/>
  <path d="M 30 226 L 30 204 M 30 226 L 52 226" stroke="#00ff66" stroke-width="2.5" fill="none" opacity="0.5"/>
  <path d="M 226 226 L 226 204 M 226 226 L 204 226" stroke="#00ff66" stroke-width="2.5" fill="none" opacity="0.5"/>
</svg>
